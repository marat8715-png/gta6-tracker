name: 🎮 Auto Post GTA VI News to Telegram

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

jobs:
  post-news:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests

      - name: Post news to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL: ${{ secrets.TELEGRAM_CHANNEL }}
        run: python post_news.py 2>&1 | tee last_run.log

      - name: Save logs and hashes
        if: always()
        run: |
          git config user.email "bot@github.com"
          git config user.name "GTA6 Bot"
          git add posted_hashes.json last_run.log 2>/dev/null || true
          git diff --staged --quiet || git commit -m "📋 Update log [skip ci]"
          git push || true
